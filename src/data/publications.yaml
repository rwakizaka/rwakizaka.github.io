# How to add a publication
# -------------------------
# Append a new block anywhere in this file — entries are grouped by `kind` and
# sorted by year (then month) descending automatically, so order here does not
# matter. Your own name is underlined automatically via profile.yaml's
# `nameAliases`, so don't write markup in `authors`.
#
# kind: conference        -> Conference Papers (refereed)
#       journal           -> Journal Articles (refereed)
#       domestic-refereed -> Conference Papers (refereed, domestic)
#       domestic          -> Conference Papers (not refereed, domestic)
#       talk              -> Talks
#       poster            -> Posters
#
# Optional fields: month, note, location, venueUrl, links[]
# Link URLs may point at files in public/ (e.g. /papers/foo.pdf).

